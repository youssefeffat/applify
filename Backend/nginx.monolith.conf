events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Define upstream services running locally within the same container
    upstream auth_service {
        server 127.0.0.1:8001;
    }

    upstream user_service {
        server 127.0.0.1:8002;
    }

    upstream job_catalog_service {
        server 127.0.0.1:8003;
    }

    upstream tracker_service {
        server 127.0.0.1:8004;
    }

    upstream ai_service {
        server 127.0.0.1:8005;
    }

    server {
        # Listen on the port specified by Render (usually PORT is passed to Nginx, but Render routes to the exposed port)
        listen 80;
        server_name localhost;

        location /api/auth {
            proxy_pass http://auth_service/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/users {
            proxy_pass http://user_service/api/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/jobs {
            proxy_pass http://job_catalog_service/api/jobs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/applications {
            proxy_pass http://tracker_service/api/applications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /api/ai {
            proxy_pass http://ai_service/api/ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route root health checks (can point to any service, we'll use auth)
        location = / {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
        }
    }
}
